name: incoex_logistics_app
description: Aplicación móvil de INCOEX Logistics para empresas y conductores.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/incoex-logo.png
    - assets/img/
    - assets/img/brand-x.png
    - assets/img/PantallaInicio/
    - assets/img/EstadosCrearEnvio/
  fonts:
    - family: Acumin Pro
      fonts:
        - asset: assets/fonts/Acumin-RPro.otf
        - asset: assets/fonts/Acumin-ItPro.otf
          style: italic
        - asset: assets/fonts/Acumin-BdPro.otf
          weight: 700
        - asset: assets/fonts/Acumin-BdItPro.otf
          weight: 700
          style: italic
